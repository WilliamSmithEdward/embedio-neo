name: Publish

# Version tags publish through NuGet trusted publishing and release GitHub assets.
# The owner must configure the nuget.org policy and approve package identities.
# Hand-started runs are always dry runs. Never tag the development placeholder.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the NuGet package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # First, so a mistyped tag fails in seconds. A tag that says one thing
      # and a package that says another puts a release on nuget.org under a
      # number nobody chose, and a number on nuget.org can never be used
      # again.
      - name: Read the package version and check the tag matches it
        id: version
        run: |
          version=$(dotnet msbuild src/EmbedIO/EmbedIO.csproj -getProperty:PackageVersion)
          echo "PackageVersion: $version"
          [ -n "$version" ] || { echo "no PackageVersion in the csproj"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            [ "$version" != 3.5.0 ] || { echo '3.5.0 is an unreleased development placeholder; select an approved release version first'; exit 1; }
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "tag v$tagged does not match PackageVersion $version in the csproj"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore from the lock file
        run: dotnet restore EmbedIO.sln --locked-mode

      - name: Build Release
        run: dotnet build EmbedIO.sln --no-restore -c Release

      - name: Pack
        run: dotnet pack EmbedIO.sln --no-build -c Release -o dist

      - name: Check packages and source notices
        run: python3 scripts/check_packages.py dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: dist/
          if-no-files-found: error

  # The tagged commit's scans. A finding the accepted list does not account
  # for fails this job, and nothing is published.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ClamAV and YARA-X over the tagged commit's files and the package the
  # build job made, held to their own accepted list the same way.
  malware-scan:
    name: Malware scan
    needs: [build]
    uses: ./.github/workflows/malware-scan.yml
    with:
      package-artifact: nupkg
    permissions:
      contents: read

  publish:
    name: Publish to NuGet
    needs: [build, security, malware-scan]
    if: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: dist/
      - name: Attest the packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.nupkg
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
      - name: Obtain a short-lived NuGet key
        if: github.event_name != 'workflow_dispatch'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: WilliamSmithE
      - name: Publish the verified packages
        if: github.event_name != 'workflow_dispatch'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'dist/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [build, publish, security, malware-scan]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creating the release
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: dist/

      - name: Download the security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Download the malware report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: security-report/

      - name: Download the provenance bundle
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance/

      # Both reports and what they were made from, named for the release:
      # embedio-neo-1.2.3-security-report.md,
      # embedio-neo-1.2.3-semgrep.sarif,
      # embedio-neo-1.2.3-malware-report.md,
      # embedio-neo-1.2.3-clamav.json, and the provenance bundle as
      # embedio-neo-1.2.3.sigstore.json.
      - name: Name the reports after the release
        run: |
          [ -n "$VERSION" ] || { echo "the build job gave no version"; exit 1; }
          for file in security-report/*; do
            mv "$file" "security-report/embedio-neo-$VERSION-$(basename "$file")"
          done
          if [ "$DRY_RUN" != true ]; then
            test "$(find provenance -type f | wc -l)" = 1
            mv provenance/* "provenance/embedio-neo-$VERSION.sigstore.json"
          fi

      # The version's section of CHANGELOG.md, the notes written for it. A
      # release without one fails here rather than going out with no notes.
      - name: Extract the changelog section for this version
        id: notes
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture=1; found=1; next }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release_notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG.md's section for $VERSION is empty"
            exit 1
          fi
          cat release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report/
            release_notes.md
          if-no-files-found: error

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
            provenance/*
          fail_on_unmatched_files: true
