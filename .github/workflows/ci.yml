name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-https-locks:
        description: Regenerate test-only MAUI HTTPS dependency locks for review
        type: boolean
        default: false

# The opt-in runtime close probe lives in diagnostics.yml.

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DisableImplicitNuGetFallbackFolder: true
  # The .NET CLI uploads telemetry from a background thread. On macOS a child it forks
  # while that thread initializes libSystem's notify state aborts before exec, and
  # dotnet then reports exit code 137 (#401). Every workflow that runs the CLI opts out.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  changes:
    # Documentation-only pull requests skip the test matrix and the app smokes;
    # static analysis, the package build and CI passed still run. A changed path
    # is documentation when it matches one of these patterns:
    #   docs/**              guides, platform notes, project records, docs/toc.yml
    #   images/**            README images and the package icon
    #   **/*.md              README.md, CHANGELOG.md, MIGRATION.md, CLI.md,
    #                        AGENT_PRIMER.md, AGENTS.md, CONTRIBUTING.md,
    #                        SECURITY.md and every other Markdown file
    #   docfx.json, toc.yml  the DocFX site definition
    # The build job packs and checks README.md and the icon on every run, so a
    # change to either is still verified. Everything else (source, tests, scripts,
    # workflows, lock files, licenses, props) is code. Pushes and manual dispatches
    # always run everything, including the legs that pull requests leave out (the
    # Android lifecycle smoke and the macOS compatibility job); iOS and the
    # Windows AppContainer smoke are manual only.
    name: Classify the changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The merge base of the pull request must be reachable.
          fetch-depth: 0
      - name: Decide whether the change reaches beyond the documentation
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if test "$EVENT_NAME" = pull_request; then
            code=false
            # Three dots: the files this pull request changes since its merge base,
            # not what the base branch gained after the branch left it.
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
            # Nothing to classify means nothing to skip.
            test -s changed-files.txt || code=true
            while IFS= read -r path; do
              case "$path" in
                docs/*|images/*|*.md|docfx.json|toc.yml) echo "docs: $path" ;;
                *) code=true; echo "code: $path" ;;
              esac
            done < changed-files.txt
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, quic-native]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, native-rid: linux-x64}
          - {os: windows-2025, native-rid: ''}
          - {os: macos-15, native-rid: osx-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os != 'Windows'
        with:
          name: quic-native-${{ matrix.native-rid }}
          path: TestResults/quic-test-native
      - name: Verify the source-build test TLS runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          QUIC_RID: ${{ matrix.native-rid }}
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          python3 native/EmbedIO.Quic.Tls/stage.py asset --output TestResults/quic-test-native --rids "$QUIC_RID"
          printf 'EmbedIOQuicNativeTlsDirectory=%s/TestResults/quic-test-native\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install the pinned MsQuic library for the .NET QUIC test client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/libmsquic_2.6.2_amd64.deb"
          curl --fail --location --retry 3 --output "$package" https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.2_amd64.deb
          printf '%s  %s\n' 9ac90841ad45d99c1ff85b427d6dc7f0849291d596f0049d13db779a5a66ba4e "$package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$package"
          dpkg-query --show libmsquic
      - name: Install the pinned macOS MsQuic library for the .NET QUIC test client
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bottle="$RUNNER_TEMP/libmsquic--2.6.2.arm64_sequoia.bottle.tar.gz"
          curl --fail --location --retry 3 --header 'Authorization: Bearer QQ==' --output "$bottle" https://ghcr.io/v2/homebrew/core/libmsquic/blobs/sha256:c7d7fbdaec216ced0ed5b9b7b58d3d6b251e96dc4d666409e3fb211cf8c3bf55
          printf '%s  %s\n' c7d7fbdaec216ced0ed5b9b7b58d3d6b251e96dc4d666409e3fb211cf8c3bf55 "$bottle" | shasum -a 256 --check
          # Keep the pinned bottle isolated; current brew does not accept this
          # local bottle path as an install target. Relocate only its dylib.
          brew install openssl@3
          quic_root="$RUNNER_TEMP/embedio-msquic"
          mkdir -p "$quic_root" TestResults
          tar -xzf "$bottle" -C "$quic_root"
          quic_lib="$quic_root/libmsquic/2.6.2/lib"
          install_name_tool -id "$quic_lib/libmsquic.2.dylib" -change '@@HOMEBREW_PREFIX@@/opt/openssl@3/lib/libcrypto.3.dylib' "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib" "$quic_lib/libmsquic.2.6.2.dylib"
          codesign --force --sign - "$quic_lib/libmsquic.2.6.2.dylib"
          otool -L "$quic_lib/libmsquic.2.6.2.dylib" | tee TestResults/quic-native-macos.log
          shasum -a 256 "$quic_lib/libmsquic.2.6.2.dylib" >> TestResults/quic-native-macos.log
          printf 'DYLD_FALLBACK_LIBRARY_PATH=%s\n' "$quic_lib" >> "$GITHUB_ENV"
      - name: Restore from the lock files
        run: dotnet restore EmbedIO.sln --locked-mode
      - name: Build the tests
        run: dotnet build test/EmbedIO.Tests/EmbedIO.Tests.csproj -c Release --no-restore -p:RunAnalyzers=true
      - name: Provision the pinned independent QUIC datagram peer
        shell: bash
        run: python scripts/setup_datagram_peer.py
      - name: Validate Windows recordless QUIC TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/run-quic-schannel.ps1
      - name: Run the regression suite
        shell: bash
        env:
          EMBEDIO_REQUIRE_QUIC: '1'
          EMBEDIO_MINIMUM_REGRESSION_TESTS: '7502'
          # Scheduling allowance; case deadlines and discovery stay enforced.
          EMBEDIO_REGRESSION_TIMEOUT: '12m'
        run: |
          set -euo pipefail
          # Coverage has no consumer on pull requests (no upload, no threshold), so
          # only pushes to main pay for the instrumented run.
          coverage=''
          if test "$GITHUB_EVENT_NAME" = push; then coverage=--coverlet; fi
          if test "$RUNNER_OS" != Windows; then
            # Owner-approved ordinary CI diagnostics: JSON crash reports only,
            # without heap dumps or changes to regression/failure policy.
            mkdir -p "$RUNNER_TEMP/embedio-crash-reports"
            export DOTNET_DbgEnableMiniDump=1
            export DOTNET_EnableCrashReportOnly=1
            export DOTNET_DbgMiniDumpName="$RUNNER_TEMP/embedio-crash-reports/crash.%p"
          fi
          dotnet test --project test/EmbedIO.Tests/EmbedIO.Tests.csproj -c Release --no-build --report-trx --results-directory TestResults --timeout "$EMBEDIO_REGRESSION_TIMEOUT" --minimum-expected-tests "$EMBEDIO_MINIMUM_REGRESSION_TESTS" $coverage
      - name: Verify independent HPACK interoperability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/hpack-venv"
          "$RUNNER_TEMP/hpack-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r test/EmbedIO.Fuzz/hpack-requirements.txt
          "$RUNNER_TEMP/hpack-venv/bin/python" test/EmbedIO.Fuzz/hpack_interop.py generate unused TestResults/hpack-independent.jsonl
          dotnet restore test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj --locked-mode
          dotnet run --project test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj -c Release --no-restore -- --hpack-corpus TestResults/hpack-independent.jsonl TestResults/hpack-ours.jsonl
          "$RUNNER_TEMP/hpack-venv/bin/python" test/EmbedIO.Fuzz/hpack_interop.py verify TestResults/hpack-independent.jsonl TestResults/hpack-ours.jsonl
      - name: Validate written OpenAPI documents independently
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          "$RUNNER_TEMP/openapi-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r .github/requirements/openapi.txt
          # OpenAPI and typed-result regressions write these during the full test run above.
          "$RUNNER_TEMP/openapi-venv/bin/openapi-spec-validator" \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/people.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/values.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/security.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/declared.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/typed-errors.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/typed-binding.json \
            test/EmbedIO.Tests/bin/Release/net10.0/openapi/minimal-endpoints.json
      - name: Verify independent QPACK codecs and feedback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qpack-venv"
          "$RUNNER_TEMP/qpack-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r test/EmbedIO.QpackInterop/requirements.txt
          dotnet restore test/EmbedIO.QpackInterop/EmbedIO.QpackInterop.csproj --locked-mode
          dotnet build test/EmbedIO.QpackInterop/EmbedIO.QpackInterop.csproj -c Release --no-restore
          dotnet build src/EmbedIO/EmbedIO.csproj -c Release --no-restore
          "$RUNNER_TEMP/qpack-venv/bin/python" test/EmbedIO.QpackInterop/verify.py src/EmbedIO/bin/Release/net10.0/EmbedIO.dll
          "$RUNNER_TEMP/qpack-venv/bin/python" test/EmbedIO.QpackInterop/verify.py src/EmbedIO/bin/Release/netstandard2.0/EmbedIO.dll
      - name: Verify ZIP concurrency with a constrained worker pool
        env:
          DOTNET_PROCESSOR_COUNT: 2
        run: dotnet test --project test/EmbedIO.Tests/EmbedIO.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Issue491_ZipConcurrency --report-trx --results-directory TestResults/zip-constrained --timeout 2m --minimum-expected-tests 27
      - name: Stress immediate client resets on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5; do
            dotnet test --project test/EmbedIO.Tests/EmbedIO.Tests.csproj -c Release --no-build \
              --filter 'FullyQualifiedName~Issue38_MacAcceptReset|FullyQualifiedName~IncompleteAndDisconnectedClientsDoNotStopHealthyRequests' \
              --report-trx --results-directory "TestResults/mac-reset-$iteration" \
              --timeout 2m --minimum-expected-tests 17
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error
      - name: Retain Unix test-host crash reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os != 'Windows'
        with:
          name: test-host-crash-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/embedio-crash-reports/*.json
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Compatibility and allocation budgets (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # macOS runs on pushes to main and manual dispatches only (owner decision,
      # 2026-10-15): the leg is absent from pull-request runs, not skipped.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-24.04","windows-2025"]}' || '{"os":["ubuntu-24.04","windows-2025","macos-15"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Create the results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force TestResults | Out-Null
      - name: Verify JSON migration compatibility
        run: |
          dotnet restore test/JsonMigrationProbe/JsonMigrationProbe.csproj --locked-mode
          dotnet run --project test/JsonMigrationProbe/JsonMigrationProbe.csproj -c Release -f net10.0 --no-restore > TestResults/json-migration-net10.log
      - name: Compare pinned upstream EmbedIO with both Neo assets
        run: python scripts/compatibility_audit.py
      - name: Verify JSON compatibility on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build test/JsonMigrationProbe/JsonMigrationProbe.csproj -c Release -f net472 --no-restore
          test/JsonMigrationProbe/bin/Release/net472/JsonMigrationProbe.exe > TestResults/json-migration-net472.log
      - name: Verify Basic authentication on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/EmbedIO.LegacyAuthenticationSmoke/EmbedIO.LegacyAuthenticationSmoke.csproj --locked-mode
          dotnet build test/EmbedIO.LegacyAuthenticationSmoke/EmbedIO.LegacyAuthenticationSmoke.csproj -c Release --no-restore
          test/EmbedIO.LegacyAuthenticationSmoke/bin/Release/net472/EmbedIO.LegacyAuthenticationSmoke.exe
      - name: Verify typed route validation on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/EmbedIO.LegacyRouteValidationSmoke/EmbedIO.LegacyRouteValidationSmoke.csproj --locked-mode
          dotnet build test/EmbedIO.LegacyRouteValidationSmoke/EmbedIO.LegacyRouteValidationSmoke.csproj -c Release --no-restore
          test/EmbedIO.LegacyRouteValidationSmoke/bin/Release/net472/EmbedIO.LegacyRouteValidationSmoke.exe
      - name: Verify SameSite cookies on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/EmbedIO.LegacyCookieSmoke/EmbedIO.LegacyCookieSmoke.csproj --locked-mode
          dotnet build test/EmbedIO.LegacyCookieSmoke/EmbedIO.LegacyCookieSmoke.csproj -c Release --no-restore
          test/EmbedIO.LegacyCookieSmoke/bin/Release/net472/EmbedIO.LegacyCookieSmoke.exe
      - name: Verify the managed HTTP engine on .NET Framework
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore test/EmbedIO.LegacyHttpEngineSmoke/EmbedIO.LegacyHttpEngineSmoke.csproj --locked-mode
          dotnet build test/EmbedIO.LegacyHttpEngineSmoke/EmbedIO.LegacyHttpEngineSmoke.csproj -c Release --no-restore
          test/EmbedIO.LegacyHttpEngineSmoke/bin/Release/net472/EmbedIO.LegacyHttpEngineSmoke.exe > TestResults/legacy-http-engine.log
      - name: Check hot-path and cold-start allocation budgets
        run: |
          dotnet restore test/EmbedIO.Performance/EmbedIO.Performance.csproj --locked-mode
          dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-restore -- --verify-allocations
          dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-audit-allocations
          dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --listener-queue --verify-allocations
          dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-cold-start
      - name: Verify fresh-process first-endpoint measurements
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --endpoint-latency 1 > TestResults/endpoint-latency-verification.jsonl
      - name: Verify HTTP/HTTPS terminal resource cleanup
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http > TestResults/listener-http-verification.json
      - name: Check body drain and header allocation budgets
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-allocations > TestResults/listener-allocation-verification.json
      - name: Verify POST body consumption over HTTP and HTTPS
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http --request-body-bytes 65536 --body-consumption full > TestResults/listener-body-full-verification.json
      - name: Repeat Windows POST connection churn in fresh processes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for repetition in 1 2 3; do
            dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http --request-body-bytes 65536 --body-consumption full --connection-policy close --requests 100 > "TestResults/listener-body-churn-$repetition.json"
          done
      - name: Verify partial POST bodies over HTTP and HTTPS
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http --request-body-bytes 65536 --body-consumption partial > TestResults/listener-body-partial-verification.json
      - name: Verify unread POST bodies over HTTP and HTTPS
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http --request-body-bytes 65536 --body-consumption none > TestResults/listener-body-none-verification.json
      - name: Check chunk framing and charset allocation budgets
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-wire > TestResults/listener-wire-verification.json
      - name: Verify chunked HTTP and HTTPS response cleanup
        run: dotnet run --project test/EmbedIO.Performance/EmbedIO.Performance.csproj -c Release --no-build -- --verify-listener-http --chunk-bytes 1024 --payload-bytes 65536 > TestResults/listener-chunked-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore from the lock files
        run: dotnet restore EmbedIO.sln --locked-mode
      - name: Reject compiler and analyzer suppressions
        run: |
          python3 scripts/test_analyzer_suppressions.py
          python3 scripts/test_analyzer_inventory.py
          python3 scripts/test_merge_review.py
          python3 scripts/check_analyzer_suppressions.py
          dotnet run --project tools/EmbedIO.AnalyzerGuard -c Release --no-restore -- .
      - name: Validate the .NET SDK updater
        run: python3 scripts/test_update_dotnet_sdk.py
      - name: Validate isolated QUIC recovery and WebTransport core
        run: |
          dotnet restore test/EmbedIO.Quic/EmbedIO.Quic.csproj --locked-mode
          dotnet build test/EmbedIO.Quic/EmbedIO.Quic.csproj -c Release --no-restore -p:RunAnalyzers=true
          dotnet test/EmbedIO.Quic/bin/Release/net10.0/EmbedIO.Quic.Development.dll self-test
      - name: Check source formatting and informational diagnostics
        run: |
          python3 -m venv "$RUNNER_TEMP/source-quality-venv"
          "$RUNNER_TEMP/source-quality-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r .github/requirements/prettycsharp.txt
          "$RUNNER_TEMP/source-quality-venv/bin/python" scripts/test_source_quality.py
          "$RUNNER_TEMP/source-quality-venv/bin/python" scripts/check_source_quality.py
      - name: Validate bounded standards capture controls
        run: '"$RUNNER_TEMP/source-quality-venv/bin/python" -I test/EmbedIO.Conformance/standards/test_capture_standards.py'
      - name: Upload source quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-quality
          path: TestResults/source-quality/
          if-no-files-found: warn
      - name: Verify formatting
        # Folder mode covers the test and tool projects outside EmbedIO.sln too, the MAUI
        # apps included, without loading them; SDK-generated files are skipped.
        run: |
          dotnet format whitespace EmbedIO.sln --no-restore --verify-no-changes
          dotnet format whitespace test --folder --verify-no-changes
          dotnet format whitespace tools --folder --verify-no-changes
      - name: Run the SDK and NUnit analyzers
        run: dotnet build EmbedIO.sln -c Release --no-restore -p:RunAnalyzers=true -p:EnforceCodeStyleInBuild=true
      - name: Validate offline HTTP2/HTTP3 campaign oracles and comparison ownership
        run: |
          python3 -m venv "$RUNNER_TEMP/conformance-oracles-venv"
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r .github/requirements/conformance-oracles.txt
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -I test/EmbedIO.Conformance/drivers/test_campaign_oracles.py
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -I test/EmbedIO.Conformance/drivers/resource_oracle_test.py
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -I test/EmbedIO.Conformance/drivers/resource_framing_test.py
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -I test/EmbedIO.Conformance/drivers/h3_resource_oracle_test.py
          "$RUNNER_TEMP/conformance-oracles-venv/bin/python" -I test/EmbedIO.Conformance/drivers/settings_ack_test.py
          pwsh -NoProfile -File scripts/test_comparison_processes.ps1
      - name: Validate standalone load benchmark tooling
        run: |
          python3 scripts/test_compare_load_benchmark.py
          python3 scripts/test_analyze_endurance.py
          python3 scripts/test_conformance_repro.py
          python3 scripts/test_conformance_campaigns.py
          python3 scripts/test_guarded_load_benchmark.py
          python3 scripts/test_summarize_teardown_exceptions.py
          python3 scripts/test_teardown_cost_campaign.py
          dotnet restore test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj --locked-mode
          dotnet build test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj -c Release --no-restore -p:RunAnalyzers=true -p:EnforceCodeStyleInBuild=true
          dotnet test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll exception-accounting-check
          dotnet test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll teardown-accounting-check
          dotnet test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll load-failure-check

  build:
    name: Build and check the NuGet packages
    needs: [changes, quic-native]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.code == 'false' || needs.quic-native.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: ./.github/actions/quic-runtime
        if: needs.changes.outputs.code == 'true'
        with:
          output: dist
      - name: Restore from the lock files
        run: dotnet restore EmbedIO.sln --locked-mode
      - name: Build and pack both library targets and the CLI
        run: dotnet pack EmbedIO.sln -c Release --no-restore -o dist -p:RunAnalyzers=true
      - name: Check package contents and source notices
        shell: bash
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          runtime=()
          if [ "$CODE_CHANGED" = true ]; then runtime=(--native-staging TestResults/quic-native-staged); fi
          python3 scripts/check_packages.py dist "${runtime[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: dist/*.nupkg
          if-no-files-found: error

  package-malware:
    name: Package malware scan
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/malware-scan.yml
    with:
      package-artifact: nupkg
      include-native: true
    permissions:
      contents: read

  mac-catalyst:
    name: Mac Catalyst
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/mac-catalyst.yml

  android:
    name: Android
    # The Android 10 lifecycle smoke runs on pushes to main and manual
    # dispatches only (owner decision, 2026-10-15: about 4.3 minutes per run);
    # the MAUI HTTPS android leg below still runs on every code pull request.
    needs: [changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/android-smoke.yml

  maui-https:
    name: MAUI HTTPS
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/maui-https.yml
    with:
      update-locks: ${{ inputs.update-https-locks == true }}
      # iOS runs on demand only: gh workflow run maui-https.yml --ref <branch>
      include-ios: false

  # The Windows AppContainer smoke (appcontainer.yml) is manual only since
  # 2026-10-15: gh workflow run appcontainer.yml --ref <branch>

  aot-smoke:
    name: Native AOT
    needs: [changes, quic-native]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/aot-smoke.yml
    with:
      reuse-native-artifacts: true

  quic-native:
    name: QUIC runtime inputs
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/quic-native.yml

  quic-portable:
    name: Portable QUIC TLS
    needs: [changes, quic-native]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/quic-portable.yml
    with:
      reuse-native-artifacts: true

  # The independent quic-go peer for the WebTransport interop jobs, built once in the
  # Go image its one-line Dockerfile pins by digest; go.sum verifies the modules.
  webtransport-peer:
    name: WebTransport peer
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the peer for Linux and macOS
        shell: bash
        run: |
          set -euo pipefail
          docker build --quiet --tag embedio-webtransport-go test/EmbedIO.Quic/peer
          mkdir -p TestResults/webtransport-peer
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env GOCACHE=/tmp/go-cache \
            --env GOPATH=/tmp/go --env GOFLAGS=-mod=readonly --env CGO_ENABLED=0 \
            --mount "type=bind,source=$PWD/test/EmbedIO.Quic/peer,target=/source,readonly" \
            --mount "type=bind,source=$PWD/TestResults/webtransport-peer,target=/out" \
            --workdir /source embedio-webtransport-go sh -c 'go mod verify &&
              GOOS=linux GOARCH=amd64 go build -trimpath -o /out/linux-x64/webtransport-peer . &&
              GOOS=darwin GOARCH=arm64 go build -trimpath -o /out/osx-arm64/webtransport-peer .'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webtransport-peer
          path: TestResults/webtransport-peer/
          if-no-files-found: error

  # Public WebTransport sessions against the independent quic-go peer, over the TLS
  # runtime this run built. The .NET QUIC client cannot open sessions.
  webtransport-interop:
    name: WebTransport interop (${{ matrix.rid }})
    needs: [changes, quic-native, webtransport-peer]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: macos-15, rid: osx-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-native-${{ matrix.rid }}
          path: TestResults/quic-test-native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webtransport-peer
          path: TestResults/webtransport-peer
      - name: Verify the source-build test TLS runtime
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          python3 native/EmbedIO.Quic.Tls/stage.py asset --output TestResults/quic-test-native --rids "$QUIC_RID"
          printf 'EmbedIOQuicNativeTlsDirectory=%s/TestResults/quic-test-native\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build the development host
        run: |
          dotnet restore test/EmbedIO.Quic/EmbedIO.Quic.csproj --locked-mode
          dotnet build test/EmbedIO.Quic/EmbedIO.Quic.csproj -c Release --no-restore
      - name: Prepare the peer
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          peer="$GITHUB_WORKSPACE/TestResults/webtransport-peer/$QUIC_RID/webtransport-peer"
          chmod +x "$peer"
          # Apple silicon runs only signed code; re-sign the cross-built peer ad hoc.
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "$peer"; fi
          printf 'WEBTRANSPORT_PEER=%s\n' "$peer" >> "$GITHUB_ENV"
      - name: Verify WebTransport sessions against the peer
        run: >-
          python3 test/EmbedIO.Quic/verify_webtransport_production.py --dotnet "$(command -v dotnet)"
          --assembly test/EmbedIO.Quic/bin/Release/net10.0/EmbedIO.Quic.Development.dll
          --peer "$WEBTRANSPORT_PEER" --output TestResults/webtransport-production
      # The same modes in draft-14, the dialect Safari 27 speaks.
      - name: Verify draft-14 WebTransport sessions against the peer
        run: >-
          python3 test/EmbedIO.Quic/verify_webtransport_production.py --dotnet "$(command -v dotnet)"
          --assembly test/EmbedIO.Quic/bin/Release/net10.0/EmbedIO.Quic.Development.dll
          --peer "$WEBTRANSPORT_PEER" --output TestResults/webtransport-production-draft14 --dialect draft-14
      # The same modes with HTTP/3 address validation: the server answers every new
      # connection with a Retry, so a session opens only if the peer returns its token.
      - name: Verify WebTransport sessions through a Retry
        run: >-
          python3 test/EmbedIO.Quic/verify_webtransport_production.py --dotnet "$(command -v dotnet)"
          --assembly test/EmbedIO.Quic/bin/Release/net10.0/EmbedIO.Quic.Development.dll
          --peer "$WEBTRANSPORT_PEER" --output TestResults/webtransport-production-retry --address-validation
      # The throwaway test key stays out of the retained logs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webtransport-interop-${{ matrix.rid }}
          path: |
            TestResults/webtransport-production/
            TestResults/webtransport-production-draft14/
            TestResults/webtransport-production-retry/
            !TestResults/webtransport-production/key.pem
            !TestResults/webtransport-production-draft14/key.pem
            !TestResults/webtransport-production-retry/key.pem
          if-no-files-found: warn

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, test, compatibility, static-analysis, build, package-malware, mac-catalyst, android, maui-https, aot-smoke, quic-native, quic-portable, webtransport-peer, webtransport-interop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          # Two skips are expected: every gated job on a documentation-only pull
          # request, and the Android lifecycle smoke on any pull request. Any other
          # skip, a failure or a cancellation fails the gate.
          docs_only = results['changes']['result'] == 'success' and os.environ['CODE_CHANGED'] == 'false'
          pull_request = os.environ['EVENT_NAME'] == 'pull_request'
          gated = {'test', 'compatibility', 'mac-catalyst', 'android', 'maui-https', 'aot-smoke', 'quic-native', 'quic-portable', 'package-malware', 'webtransport-peer', 'webtransport-interop'}
          for name, job in results.items():
              optional = (docs_only and name in gated) or (pull_request and name == 'android')
              expected = 'skipped' if optional else 'success'
              assert job['result'] == expected, f"{name}: {job['result']}; required {expected}"
          print('Documentation-only change: the test matrix and the app smokes were skipped.' if docs_only else 'All required CI jobs passed.')
          PY
