name: MAUI HTTPS
on:
  workflow_call:
    inputs:
      update-locks:
        type: boolean
        default: false
      include-ios:
        # CI leaves iOS out of its pull-request and push runs (owner decision,
        # 2026-10-15: about 8 minutes of macOS wall time per run). A manual
        # dispatch includes it by default.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update-locks:
        description: Regenerate the test-only package locks for review
        type: boolean
        default: false
      include-ios:
        description: Run the iOS simulator target as well as Windows, Mac Catalyst and Android
        type: boolean
        default: true
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DisableImplicitNuGetFallbackFolder: true
  # The .NET CLI uploads telemetry from a background thread. On macOS a child it forks
  # while that thread initializes libSystem's notify state aborts before exec, and
  # dotnet then reports exit code 137 (#401). Every workflow that runs the CLI opts out.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

permissions:
  contents: read
jobs:
  smoke:
    name: MAUI HTTPS (${{ matrix.platform }})
    strategy:
      fail-fast: false
      # The iOS leg (macos-26, workload maui-ios) is present only when the caller
      # sets include-ios, so an unrequested platform is absent from the job list
      # rather than present and skipped. The other three legs never change.
      matrix: ${{ fromJSON(inputs.include-ios && '{"include":[{"platform":"windows","os":"windows-2025","workload":"maui-windows"},{"platform":"ios","os":"macos-26","workload":"maui-ios"},{"platform":"maccatalyst","os":"macos-26","workload":"maui-maccatalyst"},{"platform":"android","os":"ubuntu-24.04","workload":"maui-android"}]}' || '{"include":[{"platform":"windows","os":"windows-2025","workload":"maui-windows"},{"platform":"maccatalyst","os":"macos-26","workload":"maui-maccatalyst"},{"platform":"android","os":"ubuntu-24.04","workload":"maui-android"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SMOKE_PLATFORM: ${{ matrix.platform }}
      SMOKE_WORKLOAD: ${{ matrix.workload }}
      UPDATE_LOCKS: ${{ inputs.update-locks }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start iOS simulator boot alongside SDK setup and compilation
        if: matrix.platform == 'ios'
        run: python3 scripts/run_maui_https_smoke.py ios --ios-stage prepare
      # A private SDK avoids updating unrelated Visual Studio workloads through MSI.
      - name: Isolate the Windows smoke SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/dotnet-https" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            test/EmbedIO.HttpsCertificates/packages.lock.json
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
      - name: Install the pinned workload
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 install
      - name: Boot Android 10
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p TestResults/maui-https
          export ANDROID_AVD_HOME="$RUNNER_TEMP/embedio-https-avd"
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-29;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n embediohttps -k 'system-images;android-29;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/embediohttps.avd" --force
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd embediohttps -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > TestResults/maui-https/emulator.log 2>&1 &
      - name: Generate disposable test certificates and build the app
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 build
      - name: Execute native client, WebView and external HTTPS tests
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 run
      - name: Clean up the owned iOS simulator even after setup or build failure
        if: always() && matrix.platform == 'ios'
        run: python3 scripts/run_maui_https_smoke.py ios --ios-stage cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maui-https-${{ matrix.platform }}
          path: |
            TestResults/maui-https/${{ matrix.platform }}/
            TestResults/maui-https/emulator.log
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
          if-no-files-found: error
