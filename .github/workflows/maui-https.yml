name: MAUI HTTPS
on:
  workflow_call:
    inputs:
      update-locks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update-locks:
        description: Regenerate the test-only package locks for review
        type: boolean
        default: false
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DisableImplicitNuGetFallbackFolder: true

permissions:
  contents: read
jobs:
  smoke:
    name: MAUI HTTPS (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            workload: maui-windows
          - platform: ios
            os: macos-26
            workload: maui-ios
          - platform: maccatalyst
            os: macos-26
            workload: maui-maccatalyst
          - platform: android
            os: ubuntu-24.04
            workload: maui-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SMOKE_PLATFORM: ${{ matrix.platform }}
      SMOKE_WORKLOAD: ${{ matrix.workload }}
      UPDATE_LOCKS: ${{ inputs.update-locks }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start iOS simulator boot alongside SDK setup and compilation
        if: matrix.platform == 'ios'
        run: python3 scripts/run_maui_https_smoke.py ios --ios-stage prepare
      # A private SDK avoids updating unrelated Visual Studio workloads through MSI.
      - name: Isolate the Windows smoke SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/dotnet-https" >> $env:GITHUB_ENV
      - name: Isolate the pinned iOS SDK
        if: matrix.platform == 'ios'
        shell: pwsh
        run: '"DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/dotnet-ios" >> $env:GITHUB_ENV'
      - name: Restore the exact iOS SDK cache
        if: matrix.platform == 'ios'
        id: ios-sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: ios-sdk-${{ runner.os }}-${{ runner.arch }}-10.0.401-10.0.12-${{ hashFiles('global.json', 'scripts/check_ios_sdk.ps1') }}
      - name: Validate cached SDK and runtime pins
        if: matrix.platform == 'ios'
        id: ios-sdk-ready
        shell: pwsh
        run: ./scripts/check_ios_sdk.ps1
      - name: Restore packages when reusing the SDK
        if: matrix.platform == 'ios' && steps.ios-sdk-ready.outputs.ready == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: dotnet-cache-${{ runner.os }}-${{ hashFiles('src/**/packages.lock.json', 'test/EmbedIO.HttpsCertificates/packages.lock.json', 'test/EmbedIO.MauiHttpsSmoke/packages.ios.lock.json') }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.platform != 'ios' || steps.ios-sdk-ready.outputs.ready != 'true'
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            test/EmbedIO.HttpsCertificates/packages.lock.json
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
      - name: Verify a newly installed iOS SDK
        if: matrix.platform == 'ios' && steps.ios-sdk-ready.outputs.ready != 'true'
        shell: pwsh
        run: ./scripts/check_ios_sdk.ps1 -Required
      # Save before workload install: this cache cannot contain app/certificate/simulator state.
      - name: Save only the pinned iOS SDK installation
        if: matrix.platform == 'ios' && steps.ios-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: ${{ steps.ios-sdk-cache.outputs.cache-primary-key }}
      - name: Install the pinned workload
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 install
      - name: Boot Android 10
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p TestResults/maui-https
          export ANDROID_AVD_HOME="$RUNNER_TEMP/embedio-https-avd"
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-29;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n embediohttps -k 'system-images;android-29;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/embediohttps.avd" --force
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd embediohttps -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > TestResults/maui-https/emulator.log 2>&1 &
      - name: Generate disposable test certificates and build the app
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 build
      - name: Execute native client, WebView and external HTTPS tests
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 run
      - name: Clean up the owned iOS simulator even after setup or build failure
        if: always() && matrix.platform == 'ios'
        run: python3 scripts/run_maui_https_smoke.py ios --ios-stage cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maui-https-${{ matrix.platform }}
          path: |
            TestResults/maui-https/${{ matrix.platform }}/
            TestResults/maui-https/emulator.log
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
          if-no-files-found: error
