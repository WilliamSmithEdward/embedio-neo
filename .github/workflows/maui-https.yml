name: MAUI HTTPS
on:
  workflow_call:
    inputs:
      update-locks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update-locks:
        description: Regenerate the test-only package locks for review
        type: boolean
        default: false
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DisableImplicitNuGetFallbackFolder: true

permissions:
  contents: read
jobs:
  smoke:
    name: MAUI HTTPS (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            workload: maui-windows
          - platform: ios
            os: macos-26
            workload: maui-ios
          - platform: maccatalyst
            os: macos-26
            workload: maui-maccatalyst
          - platform: android
            os: ubuntu-24.04
            workload: maui-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SMOKE_PLATFORM: ${{ matrix.platform }}
      SMOKE_WORKLOAD: ${{ matrix.workload }}
      UPDATE_LOCKS: ${{ inputs.update-locks }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A private SDK avoids updating unrelated Visual Studio workloads through MSI.
      - name: Isolate the Windows smoke SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/dotnet-https" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            test/EmbedIO.HttpsCertificates/packages.lock.json
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
      - name: Install the pinned workload
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 install
      - name: Boot Android 10
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p TestResults/maui-https
          export ANDROID_AVD_HOME="$RUNNER_TEMP/embedio-https-avd"
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-29;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n embediohttps -k 'system-images;android-29;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/embediohttps.avd" --force
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd embediohttps -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > TestResults/maui-https/emulator.log 2>&1 &
      - name: Generate disposable test certificates and build the app
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 build
      - name: Execute native client, WebView and external HTTPS tests
        shell: pwsh
        run: ./scripts/maui_https_ci.ps1 run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maui-https-${{ matrix.platform }}
          path: |
            TestResults/maui-https/${{ matrix.platform }}/
            TestResults/maui-https/emulator.log
            test/EmbedIO.MauiHttpsSmoke/packages.${{ matrix.platform }}.lock.json
          if-no-files-found: error
