name: Teardown exception cost controls
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [codex/managed-http-engine]
    paths:
      - 'scripts/teardown_cost_campaign.py'
      - 'scripts/test_teardown_cost_campaign.py'
      - 'test/EmbedIO.LoadBenchmark/**'
      - '.github/workflows/teardown-cost.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiet-cost:
    # Drafts validate tooling first; ready_for_review schedules the full source campaign.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: Quiet exception profile and A/A cost control
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Install pinned QUIC prerequisite
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/libmsquic_2.6.2_amd64.deb"
          curl --fail --location --retry 3 --output "$package" https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.2_amd64.deb
          printf '%s  %s\n' 9ac90841ad45d99c1ff85b427d6dc7f0849291d596f0049d13db779a5a66ba4e "$package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$package"
      - name: Verify campaign accounting
        run: python -m unittest discover -s scripts -p test_teardown_cost_campaign.py
      - name: Restore separate benchmark
        run: dotnet restore test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj --locked-mode
      - name: Build separate benchmark
        run: dotnet build test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Verify census and pacing controls
        run: dotnet test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll teardown-accounting-check
      - name: Record profiles and unprofiled comparisons
        run: python scripts/teardown_cost_campaign.py --runner test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll --output TestResults/teardown-cost
      - name: Retain successful and failed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teardown-cost-attempt-${{ github.run_attempt }}
          path: TestResults/teardown-cost
          if-no-files-found: error
          retention-days: 30
