name: AFL++ parser campaign
on:
  push:
    branches: [main]
    paths: ['src/EmbedIO/**', 'src/EmbedIO.Quic/**', 'src/Shared/**', 'test/EmbedIO.SharpFuzz/**', 'test/EmbedIO.Quic/**', 'test/EmbedIO.Fuzz/MultipartFuzzChecks.cs', 'scripts/run-afl*', '.github/workflows/afl.yml', '.editorconfig', 'Directory.*.props', 'global.json']
  pull_request:
    paths: ['src/EmbedIO/**', 'src/EmbedIO.Quic/**', 'src/Shared/**', 'test/EmbedIO.SharpFuzz/**', 'test/EmbedIO.Quic/**', 'test/EmbedIO.Fuzz/MultipartFuzzChecks.cs', 'scripts/run-afl*', '.github/workflows/afl.yml', '.editorconfig', 'Directory.*.props', 'global.json']
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  afl:
    name: AFL++ managed parser and QUIC coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure crash delivery on the disposable runner
        shell: bash
        run: |
          sysctl -n kernel.core_pattern > "$RUNNER_TEMP/afl-core-pattern"
          sudo sysctl -w kernel.core_pattern=core
      - name: Validate managed coverage and run AFL++
        shell: bash
        env:
          CAMPAIGN_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: pwsh -NoProfile -File ./scripts/run-afl.ps1 -Seconds "$CAMPAIGN_SECONDS" -Seed "$((GITHUB_RUN_ID % 2147483646 + 1))"
      - name: Archive original AFL filenames
        if: always()
        shell: bash
        run: |
          sudo tar -czf "$RUNNER_TEMP/afl-evidence.tar.gz" -C TestResults afl
          sudo chmod a+r "$RUNNER_TEMP/afl-evidence.tar.gz"
      - name: Retain coverage, corpus and failure inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afl-${{ github.sha }}
          path: ${{ runner.temp }}/afl-evidence.tar.gz
          if-no-files-found: error
      - name: Restore the runner crash configuration
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/afl-core-pattern"; then
            sudo sysctl -w "kernel.core_pattern=$(cat "$RUNNER_TEMP/afl-core-pattern")"
          fi
