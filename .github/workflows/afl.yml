name: AFL++ parser campaign
on:
  push:
    branches: [main]
    paths: ['src/EmbedIO/**', 'src/Shared/**', 'test/EmbedIO.SharpFuzz/**', 'scripts/run-afl*', '.github/workflows/afl.yml', '.editorconfig', 'Directory.*.props', 'global.json']
  pull_request:
    paths: ['src/EmbedIO/**', 'src/Shared/**', 'test/EmbedIO.SharpFuzz/**', 'scripts/run-afl*', '.github/workflows/afl.yml', '.editorconfig', 'Directory.*.props', 'global.json']
  schedule:
    - cron: '17 6 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  afl:
    name: AFL++ managed parser coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate managed coverage and run AFL++
        shell: pwsh
        env:
          CAMPAIGN_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: ./scripts/run-afl.ps1 -Seconds ([int]$env:CAMPAIGN_SECONDS) -Seed ([int]([long]$env:GITHUB_RUN_ID % 2147483646) + 1)
      - name: Retain coverage, corpus and failure inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afl-${{ github.sha }}
          path: TestResults/afl
          if-no-files-found: error
