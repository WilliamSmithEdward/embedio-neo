name: HTTP3 host controls

# Manual research campaign (issue #283), about 40 to 60 minutes across its two
# runners: paced HTTP/3 churn on a quiet Linux reference host and under bounded
# CPU contention, repeated on Windows. It used to run on pull requests to the
# retired codex/managed-http-engine integration branch; run it by hand with
# `gh workflow run http3-quiet-host.yml --ref <branch>`. The method, the
# acceptance rules and the recorded results are in
# docs/project/http3-quiet-host-validation.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    name: ${{ matrix.control }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            control: Quiet reference and contention
          - os: windows-2025
            control: Ambient repeat and contention
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Install pinned Linux QUIC client prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/libmsquic_2.6.2_amd64.deb"
          curl --fail --location --retry 3 --output "$package" https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.2_amd64.deb
          printf '%s  %s\n' 9ac90841ad45d99c1ff85b427d6dc7f0849291d596f0049d13db779a5a66ba4e "$package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$package"
      - uses: ./.github/actions/quic-source-runtime
        id: quic-runtime
      - name: Verify acceptance checks
        run: python -m unittest discover -s scripts -p test_http3_quiet_campaign.py
      - name: Restore the separate-process comparison runner
        run: dotnet restore test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj --locked-mode
      - name: Build the separate-process comparison runner
        env:
          EmbedIOQuicNativeTlsDirectory: ${{ steps.quic-runtime.outputs.native-tls-directory }}
        run: dotnet build test/EmbedIO.LoadBenchmark/EmbedIO.LoadBenchmark.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Compare declared host control and bounded CPU contention
        run: python scripts/http3_quiet_campaign.py --runner test/EmbedIO.LoadBenchmark/bin/Release/net10.0/EmbedIO.LoadBenchmark.dll --output TestResults/http3-quiet-host
      - name: Preserve all successful and failed samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http3-quiet-host-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults/http3-quiet-host
            TestResults/quic-source-native
          if-no-files-found: error
          retention-days: 30
