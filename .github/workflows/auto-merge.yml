name: Auto-merge

# Repository-local divergence from repo-standards/templates/automerge.
# Routine updates still receive ordinary PR checks. Leave them open for an
# explicit exact-head review of ALL checks, including supplemental scanners;
# required branch gates alone must never trigger an early future auto-merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Leave automated updates for all-checks review
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # disable an existing future auto-merge, never merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Execute trusted base policy, never code from a dependency update.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Defer merging until every exact-head check has been reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python .github/security/merge_review.py "$PR_URL"
