name: Auth-fuzz probe

# Throwaway diagnosis for the macOS auth-fuzz no-reply flake. Never merged.
on:
  push:
    branches: [codex/auth-fuzz-probe]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  auth-fuzz:
    name: auth-fuzz client sockets (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 1, induced: 3, dual: 12, ipv4: 4}
          - {shard: 2, induced: 0, dual: 16, ipv4: 8}
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      # The feed main's #569 head built; its tree equals main 9c50b418.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed
          run-id: 40584597622
          github-token: ${{ github.token }}
      - name: Install the pinned peer
        shell: bash
        run: |
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r test/EmbedIO.Conformance/drivers/requirements.txt
      # The guard must name fuzz_client_certificate_dual_stack.py, which this branch adds.
      - name: Peer regressions
        continue-on-error: true
        shell: bash
        run: python3 -m unittest discover -s test/EmbedIO.Quic -p "test_*peer.py" -v
      - name: auth-fuzz through both client sockets
        shell: bash
        env:
          INDUCED: ${{ matrix.induced }}
          DUAL: ${{ matrix.dual }}
          IPV4: ${{ matrix.ipv4 }}
        run: |
          python3 probe/auth_fuzz_probe.py --feed TestResults/quic-runtime-feed --output probe-output \
            --induced "$INDUCED" --natural-dual-stack "$DUAL" --natural-ipv4 "$IPV4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: auth-fuzz-probe-${{ matrix.shard }}
          path: |
            probe-output/results.json
            probe-output/*-*/
          if-no-files-found: warn
