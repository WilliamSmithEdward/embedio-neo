name: Windows AppContainer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appcontainer:
    name: AppContainer inbound loopback smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Build the pinned test-only host
        shell: pwsh
        run: |
          dotnet restore test/EmbedIO.AppContainerSmoke/EmbedIO.AppContainerSmoke.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish test/EmbedIO.AppContainerSmoke/EmbedIO.AppContainerSmoke.csproj -c Release --no-restore -o "$env:RUNNER_TEMP/embedio-appcontainer-host"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify blocked and allowed inbound loopback
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/embedio-appcontainer-host/EmbedIO.AppContainerSmoke.exe" "$env:GITHUB_WORKSPACE/TestResults/appcontainer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw TestResults/appcontainer/result.json | ConvertFrom-Json
          if (-not $report.passed) { throw 'AppContainer network-isolation smoke failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appcontainer-smoke
          path: TestResults/appcontainer/
          if-no-files-found: error
