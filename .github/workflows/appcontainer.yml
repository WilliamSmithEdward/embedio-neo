name: Windows AppContainer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The .NET CLI uploads telemetry from a background thread. On macOS a child it forks
  # while that thread initializes libSystem's notify state aborts before exec, and
  # dotnet then reports exit code 137 (#401). Every workflow that runs the CLI opts out.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  appcontainer:
    name: AppContainer inbound loopback smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Build the pinned test-only host
        shell: pwsh
        run: ./scripts/run_appcontainer_smoke.ps1 build
      - name: Verify blocked and allowed inbound loopback
        shell: pwsh
        run: ./scripts/run_appcontainer_smoke.ps1 run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: appcontainer-smoke
          path: TestResults/appcontainer/
          if-no-files-found: error
