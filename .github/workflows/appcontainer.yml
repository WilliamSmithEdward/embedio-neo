name: Windows AppContainer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appcontainer:
    name: AppContainer inbound loopback smoke
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Build the pinned test-only host
        shell: pwsh
        run: ./scripts/run_appcontainer_smoke.ps1 build
      - name: Verify blocked and allowed inbound loopback
        shell: pwsh
        run: ./scripts/run_appcontainer_smoke.ps1 run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appcontainer-smoke
          path: TestResults/appcontainer/
          if-no-files-found: error
