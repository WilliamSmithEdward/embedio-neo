name: Portable QUIC TLS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native TLS build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, compiler: manylinux-x64}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, compiler: manylinux-arm64}
          - {os: ubuntu-24.04, rid: linux-musl-x64, compiler: musl-x64}
          - {os: ubuntu-24.04-arm, rid: linux-musl-arm64, compiler: musl-arm64}
          - {os: macos-15-intel, rid: osx-x64, compiler: macos}
          - {os: macos-26, rid: osx-arm64, compiler: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Build and audit the pinned private TLS boundary
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
          QUIC_COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          python3 -m unittest discover -s native/EmbedIO.Quic.Tls/tests -p 'test_*.py'
          if [ "$RUNNER_OS" = Linux ]; then
            docker build -f "native/EmbedIO.Quic.Tls/Dockerfile.$QUIC_COMPILER" -t embedio-quic-native-build native/EmbedIO.Quic.Tls
            mkdir -p TestResults/quic-native-build-logs
            docker run --rm --cpus 3 --memory 6g \
              --mount "type=bind,source=$PWD/native/EmbedIO.Quic.Tls,target=/source,readonly" \
              --mount "type=bind,source=$PWD/TestResults,target=/results" \
              embedio-quic-native-build bash /source/build-linux.sh "$QUIC_RID"
          else
            python3 native/EmbedIO.Quic.Tls/build.py --work "$RUNNER_TEMP/embedio-quic-native" --output TestResults/quic-native --jobs 3 --rid "$QUIC_RID"
          fi
      - name: Build the same-version Intel macOS test peer wheel
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: |
          set -euo pipefail
          python3 native/EmbedIO.Quic.Tls/build_peer_wheel.py \
            --native-work "$RUNNER_TEMP/embedio-quic-native" --native-output TestResults/quic-native \
            --work "$RUNNER_TEMP/embedio-quic-peer" --output TestResults/quic-peer-wheel \
            --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rid == 'osx-x64'
        with:
          name: quic-peer-wheel-osx-x64
          path: TestResults/quic-peer-wheel/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quic-native-${{ matrix.rid }}
          path: TestResults/quic-native/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quic-tls-build-logs-${{ matrix.rid }}
          path: |
            TestResults/quic-native-build-logs/
            ${{ runner.temp }}/embedio-quic-native/*.log
            ${{ runner.temp }}/embedio-quic-peer/*.log
          if-no-files-found: warn

  package:
    name: Assemble the six-RID runtime package
    needs: [native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quic-native-*
          path: TestResults/quic-native-inputs
      - name: Stage exact-source assets and build the local preview feed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          # Select only binary artifacts; build logs have a separate prefix.
          python3 native/EmbedIO.Quic.Tls/stage.py stage --output TestResults/quic-native-staged --inputs \
            TestResults/quic-native-inputs/quic-native-linux-x64 \
            TestResults/quic-native-inputs/quic-native-linux-arm64 \
            TestResults/quic-native-inputs/quic-native-linux-musl-x64 \
            TestResults/quic-native-inputs/quic-native-linux-musl-arm64 \
            TestResults/quic-native-inputs/quic-native-osx-x64 \
            TestResults/quic-native-inputs/quic-native-osx-arm64
          dotnet restore native/EmbedIO.Quic.Tls/EmbedIO.Quic.Native.csproj --locked-mode
          dotnet pack native/EmbedIO.Quic.Tls/EmbedIO.Quic.Native.csproj --no-restore -c Release -o TestResults/quic-runtime-feed \
            -p:EmbedIOQuicNativeAssetsDirectory="$PWD/TestResults/quic-native-staged"
          dotnet restore src/EmbedIO/EmbedIO.csproj --locked-mode
          dotnet pack src/EmbedIO/EmbedIO.csproj --no-restore -c Release -o TestResults/quic-runtime-feed
          python3 native/EmbedIO.Quic.Tls/package_feed.py --staged TestResults/quic-native-staged --feed TestResults/quic-runtime-feed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed/
          if-no-files-found: error

  portable:
    name: Portable TLS (${{ matrix.rid }})
    needs: [package]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, musl: false}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, musl: false}
          - {os: ubuntu-24.04, rid: linux-musl-x64, musl: true}
          - {os: ubuntu-24.04-arm, rid: linux-musl-arm64, musl: true}
          - {os: macos-15-intel, rid: osx-x64, musl: false}
          - {os: macos-26, rid: osx-arm64, musl: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !matrix.musl }}
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.musl }}
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.rid == 'osx-x64'
        with:
          name: quic-peer-wheel-osx-x64
          path: TestResults/quic-peer-wheel
      - name: Validate actual package consumers and full protocol suites
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
          QUIC_MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          if [ "$QUIC_MUSL" = true ]; then
            docker build -f native/EmbedIO.Quic.Tls/Dockerfile.musl-validation -t embedio-quic-package-test native/EmbedIO.Quic.Tls
            docker run --rm --cpus 3 --memory 6g --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/embedio-quic-consumer --env DOTNET_CLI_HOME=/tmp/embedio-quic-consumer \
              --mount "type=bind,source=$PWD,target=/repo" -w /repo \
              embedio-quic-package-test python3 test/EmbedIO.Quic.PackageConsumer/validate.py \
              --rid "$QUIC_RID" --feed TestResults/quic-runtime-feed --output TestResults/quic-package-validation
          else
            python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
            consumer_options=(--rid "$QUIC_RID" --feed TestResults/quic-runtime-feed --output TestResults/quic-package-validation)
            if [ "$QUIC_RID" = osx-x64 ]; then
              consumer_options+=(--peer-wheel-directory "$PWD/TestResults/quic-peer-wheel")
            fi
            python3 test/EmbedIO.Quic.PackageConsumer/validate.py "${consumer_options[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-quic-tls-${{ matrix.rid }}
          path: TestResults/quic-package-validation/
          if-no-files-found: error
