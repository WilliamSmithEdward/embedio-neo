name: Portable QUIC TLS

on:
  workflow_call:
    inputs:
      reuse-native-artifacts:
        description: Use the source-verified native artifacts built earlier in this workflow run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # The .NET CLI uploads telemetry from a background thread. On macOS a child it forks
  # while that thread initializes libSystem's notify state aborts before exec, and
  # dotnet then reports exit code 137 (#401). Every workflow that runs the CLI opts out.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  native:
    if: ${{ !inputs.reuse-native-artifacts }}
    uses: ./.github/workflows/quic-native.yml

  package:
    name: Assemble the six-RID runtime package
    needs: [native]
    if: ${{ always() && !cancelled() && (inputs.reuse-native-artifacts || needs.native.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - uses: ./.github/actions/quic-runtime
        with:
          output: TestResults/quic-runtime-feed
      - name: Pack the core and seal the exact-source local feed
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/EmbedIO/EmbedIO.csproj --locked-mode
          dotnet pack src/EmbedIO/EmbedIO.csproj --no-restore -c Release -o TestResults/quic-runtime-feed
          python3 native/EmbedIO.Quic.Tls/package_feed.py --staged TestResults/quic-native-staged --feed TestResults/quic-runtime-feed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed/
          if-no-files-found: error

  portable:
    name: Portable TLS (${{ matrix.rid }})
    needs: [package]
    # A skipped native job (reused artifacts) would otherwise skip this job too,
    # because a skip propagates down the needs chain.
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, musl: false}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, musl: false}
          - {os: ubuntu-24.04, rid: linux-musl-x64, musl: true}
          - {os: ubuntu-24.04-arm, rid: linux-musl-arm64, musl: true}
          - {os: macos-15-intel, rid: osx-x64, musl: false}
          - {os: macos-26, rid: osx-arm64, musl: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !matrix.musl }}
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !matrix.musl }}
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.rid == 'osx-x64'
        with:
          name: quic-peer-wheel-osx-x64
          path: TestResults/quic-peer-wheel
      - name: Validate actual package consumers and full protocol suites
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
          QUIC_MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          if [ "$QUIC_MUSL" = true ]; then
            docker build -f native/EmbedIO.Quic.Tls/Dockerfile.musl-validation -t embedio-quic-package-test native/EmbedIO.Quic.Tls
            docker run --rm --cpus 3 --memory 6g --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/embedio-quic-consumer --env DOTNET_CLI_HOME=/tmp/embedio-quic-consumer \
              --mount "type=bind,source=$PWD,target=/repo" -w /repo \
              embedio-quic-package-test python3 test/EmbedIO.Quic.PackageConsumer/validate.py \
              --rid "$QUIC_RID" --feed TestResults/quic-runtime-feed --output TestResults/quic-package-validation
          else
            python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
            if [[ "$QUIC_RID" == osx-* ]]; then
              # macOS requires an explicit loopback alias for the independent
              # source-IP/CID rebinding case. Own and remove only our alias.
              if ! python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.2", 0)); s.close()'; then
                sudo -n /sbin/ifconfig lo0 inet 127.0.0.2 netmask 255.255.255.255 alias
                trap 'sudo -n /sbin/ifconfig lo0 inet 127.0.0.2 -alias' EXIT
              fi
              python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.2", 0)); s.close()'
            fi
            consumer_options=(--rid "$QUIC_RID" --feed TestResults/quic-runtime-feed --output TestResults/quic-package-validation)
            if [ "$QUIC_RID" = osx-x64 ]; then
              consumer_options+=(--peer-wheel-directory "$PWD/TestResults/quic-peer-wheel")
            fi
            python3 test/EmbedIO.Quic.PackageConsumer/validate.py "${consumer_options[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-quic-tls-${{ matrix.rid }}
          path: TestResults/quic-package-validation/
          if-no-files-found: error

  # The package consumers as signed macOS apps with the hardened runtime: Native AOT in
  # an .app bundle and self-contained JIT. Ad-hoc signing has no Team ID, so library
  # validation is disabled, and a control without that must be refused (#524).
  hardened:
    name: Hardened runtime (osx-arm64)
    needs: [package]
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed
      - name: Run the package consumers as hardened-runtime apps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          consumers=TestResults/quic-hardened-consumers
          peer="$PWD/TestResults/quic-hardened-peer"
          python3 test/EmbedIO.Quic.PackageConsumer/validate.py --rid osx-arm64 --feed TestResults/quic-runtime-feed \
            --output "$consumers" --consumers-only --peer-directory "$peer"
          python3 test/EmbedIO.Quic.PackageConsumer/validate_hardened.py --rid osx-arm64 --feed TestResults/quic-runtime-feed \
            --consumers "$consumers" --peer "$peer/bin/python" --output TestResults/quic-hardened-validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quic-hardened-osx-arm64
          path: |
            TestResults/quic-hardened-validation/
            TestResults/quic-hardened-consumers/*.log
            TestResults/quic-hardened-consumers/receipt.json
            !TestResults/quic-hardened-validation/layouts/
            !TestResults/quic-hardened-validation/self-contained/
          if-no-files-found: error

  # .NET 10's own floors are glibc 2.27 and musl 1.2.3. The consumers are built and checked
  # on the runner's RID, then run in a container of that floor while the independent peer
  # stays on the host (#524).
  floor:
    name: Oldest libc (${{ matrix.rid }})
    needs: [package]
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, musl: false}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, musl: false}
          - {os: ubuntu-24.04, rid: linux-musl-x64, musl: true}
          - {os: ubuntu-24.04-arm, rid: linux-musl-arm64, musl: true}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !matrix.musl }}
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quic-runtime-feed
          path: TestResults/quic-runtime-feed
      - name: Run the package consumers on the oldest glibc or musl
        shell: bash
        env:
          QUIC_RID: ${{ matrix.rid }}
          QUIC_MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          consumers=TestResults/quic-floor-consumers
          peer="$PWD/TestResults/quic-floor-peer"
          build=()
          if [ "$QUIC_MUSL" = true ]; then
            # Build and check the consumers on current Alpine, as the portable job does, and
            # take the musl runtime they were built with from the same image.
            docker build -f native/EmbedIO.Quic.Tls/Dockerfile.musl-validation -t embedio-quic-package-test native/EmbedIO.Quic.Tls
            docker run --rm --cpus 3 --memory 6g --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/embedio-quic-consumer --env DOTNET_CLI_HOME=/tmp/embedio-quic-consumer \
              --mount "type=bind,source=$PWD,target=/repo" -w /repo \
              embedio-quic-package-test python3 test/EmbedIO.Quic.PackageConsumer/validate.py \
              --rid "$QUIC_RID" --feed TestResults/quic-runtime-feed --output "$consumers" --consumers-only
            sdk_container=$(docker create embedio-quic-package-test)
            docker cp "$sdk_container:/usr/share/dotnet" TestResults/quic-floor-sdk
            docker rm "$sdk_container"
            dotnet_root="$PWD/TestResults/quic-floor-sdk"
            dockerfile=native/EmbedIO.Quic.Tls/Dockerfile.floor-musl
            # That peer was Alpine's; the host needs its own.
            python3 -m venv "$peer"
            "$peer/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: \
              -r test/EmbedIO.Conformance/drivers/requirements.txt
          else
            python3 test/EmbedIO.Quic.PackageConsumer/validate.py --rid "$QUIC_RID" --feed TestResults/quic-runtime-feed \
              --output "$consumers" --consumers-only --peer-directory "$peer"
            dotnet_root=$(dirname "$(readlink -f "$(command -v dotnet)")")
            dockerfile=native/EmbedIO.Quic.Tls/Dockerfile.floor-glibc
            # A Native AOT binary runs only on the glibc it was built against or a newer one,
            # so the floor publishes its own AOT consumer.
            docker build -f "$dockerfile" --target build -t embedio-quic-floor-build native/EmbedIO.Quic.Tls
            build=(--build-image embedio-quic-floor-build)
          fi
          docker build -f "$dockerfile" --target runtime -t embedio-quic-floor native/EmbedIO.Quic.Tls
          python3 test/EmbedIO.Quic.PackageConsumer/validate_floor.py --rid "$QUIC_RID" --feed TestResults/quic-runtime-feed \
            --consumers "$consumers" --image embedio-quic-floor "${build[@]}" --dotnet-root "$dotnet_root" \
            --peer "$peer/bin/python" --output TestResults/quic-floor-validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quic-floor-${{ matrix.rid }}
          path: |
            TestResults/quic-floor-validation/
            TestResults/quic-floor-consumers/*.log
            TestResults/quic-floor-consumers/receipt.json
            !TestResults/quic-floor-validation/dotnet/
            !TestResults/quic-floor-validation/nuget/
            !TestResults/quic-floor-validation/aot-floor/
            !TestResults/quic-floor-validation/*-missing-runtime/
          if-no-files-found: error
