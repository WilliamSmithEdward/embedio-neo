name: Update .NET SDK

# Each Monday, and on demand, proposes the newest .NET SDK patch in the feature
# band global.json pins, together with every pin that follows it, in one pull
# request against the branch the workflow ran on. In separate pull requests it
# proposes the newest workload set for that SDK patch and moves pinned SDK
# container images to the SDK global.json names. scripts/update_dotnet_sdk.py
# has the rules: a seven-day cooldown unless the move brings a runtime Microsoft
# marks as a security release, downloads checked against the SHA-512 Microsoft's
# releases.json or nuget.org's catalog records, no feature-band moves, and
# lock-file changes limited to the old runtime's version moving to the new one.
#
# Two jobs, so the downloaded SDK and the restore only ever run without write
# access: `prepare` works out the move with a read-only token, `propose` checks
# the proposal against the commit the workflow ran on and commits it through
# the GitHub API. No checkout keeps credentials. A pull request opened with the
# workflow's own token starts no workflows, so `propose` starts CI, Security and
# Malware scan on the new branch. The repository setting "Allow GitHub Actions
# to create and approve pull requests" must stay on for the pull request.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dotnet-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the SDK update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Work out the move
        id: prepare
        run: python scripts/update_dotnet_sdk.py prepare --out "$RUNNER_TEMP/proposal" --sdk-dir "$RUNNER_TEMP/dotnet"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: dotnet-sdk-proposal
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dotnet-sdk-restore-logs
          path: ${{ runner.temp }}/restore-logs/
          if-no-files-found: ignore
          retention-days: 7

  propose:
    name: Propose the SDK update
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commits the proposal through the git data API
      pull-requests: write # opens, labels and assigns the pull request
      actions: write # starts CI, Security and Malware scan on the new branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-sdk-proposal
          path: ${{ runner.temp }}/proposal

      - name: Propose the update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_dotnet_sdk.py propose --in "$RUNNER_TEMP/proposal"
