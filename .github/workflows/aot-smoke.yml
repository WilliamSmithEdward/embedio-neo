name: Native AOT

on:
  workflow_call:
    inputs:
      reuse-native-artifacts:
        description: Use the source-verified native TLS artifact already built in this run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aot:
    name: Native AOT smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            executable: EmbedIO.AotSmoke.exe
          - os: ubuntu-24.04
            rid: linux-x64
            executable: EmbedIO.AotSmoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      # Native AOT links with the platform toolchain. The Ubuntu archive packages are not
      # version-pinned here: the runner image's release stream provides them.
      - name: Install the Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux' && inputs.reuse-native-artifacts
        with:
          python-version: '3.14.6'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux' && inputs.reuse-native-artifacts
        with:
          name: quic-native-linux-x64
          path: TestResults/quic-aot-native
      - name: Verify the shared server TLS runtime
        if: runner.os == 'Linux' && inputs.reuse-native-artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --isolated install --require-hashes --only-binary=:all: -r native/EmbedIO.Quic.Tls/requirements.txt
          python3 native/EmbedIO.Quic.Tls/stage.py asset --output TestResults/quic-aot-native --rids linux-x64
      - uses: ./.github/actions/quic-source-runtime
        id: quic-runtime
        if: runner.os == 'Linux' && !inputs.reuse-native-artifacts
      - name: Select the shared source-build server TLS runtime
        id: shared-runtime
        if: runner.os == 'Linux' && inputs.reuse-native-artifacts
        shell: bash
        run: |
          test -f TestResults/quic-aot-native/libembedio_quic_tls.so
          printf 'directory=%s/TestResults/quic-aot-native\n' "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      # The independent BCL HTTP/3 client still requires this pinned system library.
      - name: Install pinned Linux QUIC client prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/libmsquic_2.6.2_amd64.deb"
          curl --fail --location --retry 3 --output "$package" https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.2_amd64.deb
          printf '%s  %s\n' 9ac90841ad45d99c1ff85b427d6dc7f0849291d596f0049d13db779a5a66ba4e "$package" | sha256sum --check
          sudo apt-get install --yes "$package"
          dpkg-query --show libmsquic
      - name: Restore the test-only AOT host
        shell: bash
        run: dotnet restore test/EmbedIO.AotSmoke/EmbedIO.AotSmoke.csproj --locked-mode
      # Warnings are errors: any trim or AOT warning reachable from the host fails the job.
      - name: Publish with Native AOT
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          EmbedIOQuicNativeTlsDirectory: ${{ steps.shared-runtime.outputs.directory || steps.quic-runtime.outputs.native-tls-directory }}
        run: >-
          dotnet publish test/EmbedIO.AotSmoke/EmbedIO.AotSmoke.csproj -c Release -r "$RID"
          --no-restore -o "$RUNNER_TEMP/aot" -p:TreatWarningsAsErrors=true
      - name: Serve and check real HTTP from the native executable
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          size=$(wc -c < "$RUNNER_TEMP/aot/$EXECUTABLE")
          echo "Native executable: $size bytes"
          "$RUNNER_TEMP/aot/$EXECUTABLE" TestResults/aot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aot-smoke-${{ matrix.rid }}
          path: |
            TestResults/aot
            TestResults/quic-source-native
          if-no-files-found: error
