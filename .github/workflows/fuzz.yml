name: Fuzz
on:
  push:
    branches: [main]
    paths: [src/**, test/EmbedIO.Fuzz/**, Directory.Build.props, Directory.Packages.props, global.json, .editorconfig, .github/workflows/fuzz.yml]
  pull_request:
    paths: [src/**, test/EmbedIO.Fuzz/**, Directory.Build.props, Directory.Packages.props, global.json, .editorconfig, .github/workflows/fuzz.yml]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz URL data and HTTP transport framing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore the locked dependencies
        run: dotnet restore test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj --locked-mode
      - name: Run FsCheck properties with replay and shrinking
        shell: bash
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          mkdir -p TestResults/fuzz
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-restore -- --fscheck "$seed" 10000 2>&1 | tee TestResults/fuzz/fscheck.log
      - name: Run existing mutation campaigns
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-restore -- "$seed" 100000
      - name: Compare HTTP/1 head mutations with the batch oracle
        shell: bash
        run: |
          mkdir -p TestResults/fuzz
          seed=$((GITHUB_RUN_ID % 2147483647))
          printf '%s\n' "$GITHUB_SHA" > TestResults/fuzz/source.txt
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --http1-head "$seed" 100000 2>&1 | tee TestResults/fuzz/http1-head.log
      - name: Compare HTTP/2 transport mutations with the batch oracle
        shell: bash
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --http2-transport "$seed" 100000 2>&1 | tee TestResults/fuzz/http2-transport.log
      - name: Compare HTTP/3 transport mutations with the batch oracle
        shell: bash
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --http3-transport "$seed" 100000 2>&1 | tee TestResults/fuzz/http3-transport.log
      - name: Compare capsule framing with the batch oracle
        shell: bash
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --capsule-transport "$seed" 100000 2>&1 | tee TestResults/fuzz/capsule-transport.log
      - name: Compare managed WebSocket sessions with the stateful oracle
        shell: bash
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --websocket "$seed" 100000 2>&1 | tee TestResults/fuzz/websocket.log
      - name: Retain campaign metadata and failure reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-transport-fuzz
          path: TestResults/fuzz
          if-no-files-found: ignore
  shared-state:
    name: Shared state and HTTP connections (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MODEL_CASES: ${{ github.event_name == 'schedule' && '5000' || '500' }}
      CONNECTION_CASES: ${{ github.event_name == 'schedule' && '128' || '32' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the locked state-machine harness
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force TestResults/fuzz | Out-Null
          $env:GITHUB_SHA | Set-Content TestResults/fuzz/source.txt
          dotnet restore test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj --locked-mode 2>&1 | Tee-Object TestResults/fuzz/restore.log
          if ($LASTEXITCODE) { throw 'Locked restore failed.' }
          dotnet build test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj -c Release --no-restore 2>&1 | Tee-Object TestResults/fuzz/build.log
          if ($LASTEXITCODE) { throw 'Harness build failed.' }
      - name: Verify replay, shrinking and cleanup
        run: |
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --state-machine-selftest 2>&1 | Tee-Object TestResults/fuzz/selftest.log
          if ($LASTEXITCODE) { throw 'State-machine runner self-test failed.' }
      - name: Replay every checked-in state trace
        run: |
          $ErrorActionPreference = 'Stop'
          $corpus = @(Get-ChildItem test/EmbedIO.Fuzz/state-corpus -Filter '*.json' -File | Sort-Object Name)
          if ($corpus.Count -eq 0) { throw 'State-machine corpus is empty.' }
          foreach ($trace in $corpus) {
            dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --state-machines-replay $trace.FullName 2>&1 | Tee-Object (Join-Path TestResults/fuzz ($trace.BaseName + '.log'))
            if ($LASTEXITCODE) { throw "Corpus replay failed: $($trace.Name)" }
          }
      - name: Exercise shared resource models
        run: |
          $seed = [Math]::Max(1, [long]$env:GITHUB_RUN_ID % 2147483647)
          foreach ($scenario in @('websocket-budget', 'rate-limits', 'routes', 'tunnels', 'sessions')) {
            dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --state-machines $seed $env:MODEL_CASES $scenario 2>&1 | Tee-Object (Join-Path TestResults/fuzz ($scenario + '.log'))
            if ($LASTEXITCODE) { throw "Shared-state campaign failed: $scenario" }
          }
      - name: Exercise real HTTP/1 and HTTP/2 connections
        run: |
          $seed = [Math]::Max(1, [long]$env:GITHUB_RUN_ID % 2147483647)
          foreach ($scenario in @('http1-connections', 'http2-connections')) {
            dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --state-machines $seed $env:CONNECTION_CASES $scenario 2>&1 | Tee-Object (Join-Path TestResults/fuzz ($scenario + '.log'))
            if ($LASTEXITCODE) { throw "Connection campaign failed: $scenario" }
          }
      - name: Retain traces, provenance and transition counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-machine-fuzz-${{ matrix.os }}
          path: TestResults/fuzz
          if-no-files-found: ignore
  http3-connections:
    name: Real HTTP/3 connection state machines
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONNECTION_CASES: ${{ github.event_name == 'schedule' && '128' || '32' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned Linux QUIC prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/fuzz
          package="$RUNNER_TEMP/libmsquic_2.6.2_amd64.deb"
          curl --fail --location --retry 3 --output "$package" https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.2_amd64.deb
          printf '%s  %s\n' 9ac90841ad45d99c1ff85b427d6dc7f0849291d596f0049d13db779a5a66ba4e "$package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes "$package"
          dpkg-query --show libmsquic | tee TestResults/fuzz/quic-native.log
      - name: Build the locked state-machine harness
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > TestResults/fuzz/source.txt
          dotnet restore test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj --locked-mode 2>&1 | tee TestResults/fuzz/restore.log
          dotnet build test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj -c Release --no-restore 2>&1 | tee TestResults/fuzz/build.log
      - name: Exercise real HTTP/3 connections
        shell: bash
        run: |
          set -euo pipefail
          seed=$((GITHUB_RUN_ID % 2147483647))
          if (( seed == 0 )); then seed=1; fi
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-build -- --state-machines "$seed" "$CONNECTION_CASES" http3-connections 2>&1 | tee TestResults/fuzz/http3-connections.log
      - name: Retain QUIC traces, provenance and transition counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-machine-fuzz-http3-linux
          path: TestResults/fuzz
          if-no-files-found: ignore
