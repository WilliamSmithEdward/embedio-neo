name: Fuzz
on:
  push:
    branches: [main]
    paths: [src/EmbedIO/Utilities/**, test/EmbedIO.Fuzz/**, .github/workflows/fuzz.yml]
  pull_request:
    paths: [src/EmbedIO/Utilities/**, test/EmbedIO.Fuzz/**, .github/workflows/fuzz.yml]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz URL paths and query data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore the locked dependencies
        run: dotnet restore test/EmbedIO.Fuzz/EmbedIO.Fuzz.csproj --locked-mode
      - name: Run reproducible mutation and property checks
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          dotnet run --project test/EmbedIO.Fuzz -c Release --no-restore -- "$seed" 100000
