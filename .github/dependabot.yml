# Dependabot keeps the pinned tools current: the workflows' actions, each
# pinned to a commit with its release named in a comment, the scanner images,
# each pinned by digest in a one-line Dockerfile, the pip pins in
# .github/requirements, which hold the workflow tools, and in the test
# projects that pin Python peers or oracles, and the NuGet
# packages in packages.lock.json. The YARA-X engine and the YARA Forge rules are release
# downloads Dependabot cannot follow; update-yara-rules.yml proposes those.
# update-dotnet-sdk.yml moves the SDK in global.json: a move also changes the
# workflow and runtime pins and the SDK's implicit packages in every lock file,
# which a global.json-only update would leave failing locked restore.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait. The owner's own Python packages skip the wait, as in
# every repository; none is used here today.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /.github/security/semgrep
      - /.github/security/clamav
      - /.github/test/conformance
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Semgrep pins its own dependencies exactly (pyjwt~=2.13.0, mcp==1.29.0,
  # click~=8.4.2 in 1.178.0), so a dependency moved on its own fails the
  # image's pip check. Only semgrep is proposed; the rest of the closure is
  # re-resolved with it.
  - package-ecosystem: pip
    directory: /.github/security/semgrep
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    allow:
      - dependency-name: semgrep

  - package-ecosystem: pip
    directories:
      - /.github/requirements
      - /test/EmbedIO.Conformance/drivers
      - /test/EmbedIO.Fuzz
      - /test/EmbedIO.QpackInterop
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    # The source generator compiles against Roslyn 4.8, the .NET 8 SDK's
    # compiler; a newer reference stops it loading in older supported SDKs.
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
