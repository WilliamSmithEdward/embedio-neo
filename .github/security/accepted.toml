# What the security scans are expected to report, and why each is accepted.
#
# scripts/security/security_report.py fails a scan on any finding, or any
# warning a tool raises about the scan, that this file does not list, and
# on any entry here that no longer matches. A finding is matched by tool,
# rule, file and the text of the line it flags, so it follows code that
# moves and comes back up for review when the line itself changes.
#
# Add an entry only with a reason a reviewer can check. Fixing the code
# is the better answer wherever there is one.

[[finding]]
tool = "CodeQL"
rule = "cs/zipslip"
reason = """
ZipFileProvider never extracts entries or opens entry names as local filesystem
paths. MappedResourceInfo.ForFile stores a provider-specific archive key, and
OpenFile resolves that key only with ZipArchive.GetEntry(...).Open(). The flagged
entry.FullName is an archive lookup key, not a filesystem destination. No archive entry
can make this provider write outside the archive; this extraction warning is a
false positive. Re-review if the provider gains filesystem extraction.
"""
where = [{ path = "src/EmbedIO/Files/ZipFileProvider.cs", line = "entry.FullName," }]
