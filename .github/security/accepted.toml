# What the security scans are expected to report, and why each is accepted.
#
# scripts/security/security_report.py fails a scan on any finding, or any
# warning a tool raises about the scan, that this file does not list, and
# on any entry here that no longer matches. A finding is matched by tool,
# rule, file and the text of the line it flags, so it follows code that
# moves and comes back up for review when the line itself changes.
#
# Add an entry only with a reason a reviewer can check. Fixing the code
# is the better answer wherever there is one.

# Keep the historical ZIP review in .github/security/zip-provider-codeql-review.md;
# re-review any returned result.

[[finding]]
tool = "Semgrep"
rule = "csharp.dotnet.security.use_ecb_mode.use_ecb_mode"
reason = "RFC 9001 section 5.4.3 requires a single AES block to derive QUIC header-protection masks. This statement configures the one AES-ECB encryptor each packet key keeps for that, which encrypts exactly one 16-byte sample per packet with the independently HKDF-derived quic hp key and no padding; the result only masks header bits and packet-number bytes. Packet payload encryption and authentication use AesGcm with packet-number-based nonces, per-key limits and key-generation checks. Acceptance is limited to the exact rule, file and source statement below; other findings and parser errors remain fatal."

[[finding.where]]
path = "src/EmbedIO.Quic/Cryptography/PacketKeys.cs"
line = "aes.Mode = CipherMode.ECB;"

[[finding]]
tool = "CodeQL"
rule = "cs/ecb-encryption"
reason = "The same RFC 9001 section 5.4.3 header-protection encryptor the Semgrep entry above accepts: one AES block per packet, the 16-byte sample encrypted under the quic hp key with no padding, used only to mask header bits and packet-number bytes. Payloads use AesGcm. Acceptance is limited to this rule, file and statement."

[[finding.where]]
path = "src/EmbedIO.Quic/Cryptography/PacketKeys.cs"
line = "aes.Mode = CipherMode.ECB;"
